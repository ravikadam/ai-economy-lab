[project]
name = "ai-economy-lab"
version = "0.1.0"
description = "Multi-agent AI-industry economy simulator and RL training game for customer implementation teams"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pandas>=2.1",
  "torch>=2.3",
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
  "streamlit>=1.35",
  "plotly>=5.20",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = []
